name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell tests and analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Static analysis
        shell: pwsh
        run: |
          $results = @()
          $results += Invoke-ScriptAnalyzer -Path src -Recurse -Severity Error
          $results += Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $results | Format-Table
          if ($results) { throw 'PSScriptAnalyzer found errors.' }
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path tests -CI -Output Detailed

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-bicep@v2
      - name: Compile template
        run: bicep build infra/main.bicep --outfile /tmp/main.json

